# A program is complete when its sub-issues are all closed: this closes the program issue then, and reopens it when a
# sub-issue is reopened. The project board moves the card on its own through its "item closed" workflow.
name: program-progress

on:
  issues:
    types: [closed, reopened]

permissions:
  issues: write

jobs:
  parent:
    runs-on: ubuntu-latest
    steps:
      - name: close or reopen the program when its sub-issues say so
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
        run: |
          owner=${REPO%/*}; name=${REPO#*/}
          parent=$(gh api graphql -f query='query($o:String!,$n:String!,$i:Int!){ repository(owner:$o,name:$n){ issue(number:$i){ parent { number state } } } }' \
                    -f o="$owner" -f n="$name" -F i="$NUM" --jq '.data.repository.issue.parent.number // empty')
          if [ -z "$parent" ]; then echo "#$NUM has no parent"; exit 0; fi
          pstate=$(gh api "repos/$REPO/issues/$parent" --jq .state)
          total=$(gh api --paginate "repos/$REPO/issues/$parent/sub_issues" --jq 'length' | paste -sd+ | bc)
          open=$(gh api --paginate "repos/$REPO/issues/$parent/sub_issues" --jq '[.[] | select(.state=="open")] | length' | paste -sd+ | bc)
          echo "parent #$parent is $pstate with $open of $total sub-issues open"
          if [ "$ACTION" = closed ] && [ "$open" = 0 ] && [ "$pstate" = open ]; then
            gh issue close "$parent" --repo "$REPO" --reason completed --comment "All $total sub-issues are closed, so this program is complete (closed by the program-progress workflow after #$NUM)."
          fi
          if [ "$ACTION" = reopened ] && [ "$pstate" = closed ]; then
            gh issue reopen "$parent" --repo "$REPO" --comment "#$NUM was reopened, so this program is back in progress (reopened by the program-progress workflow)."
          fi
